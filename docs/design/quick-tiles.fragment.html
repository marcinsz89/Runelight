<template id="rl-adjust"><div class="rl-overlay" data-overlay="adjust" hidden><header class="rl-header"><h2><span data-look-name>Ambient</span> controls</h2><button type="button" class="rl-icon-button cursor-interaction" style="margin-left:auto" data-action="close" aria-label="Close effect controls"><i data-lucide="x" aria-hidden="true"></i></button></header><div class="rl-card rl-context" data-adjust-context></div><label class="rl-card" data-adjust-saturation><span class="rl-row"><span>Saturation</span><span><span data-value="saturation">25</span>%</span></span><input type="range" min="0" max="100" value="25" data-field="saturation" aria-label="Ambient saturation"></label><div class="rl-sub">Black content turns the LEDs fully off.</div><button type="button" class="rl-done cursor-interaction" data-action="close">Done</button></div></template>
<script>
(() => {
  const root = document.getElementById('runelight-layouts');
  const effects = ['Ambient','Solid','Rainbow','Breathing','Pulse'];
  const states = {};
  const defaults = {effect:'Ambient',on:true,audio:false,brightness:70,sensitivity:55,response:50,saturation:25,speed:40,source:'Top',left:'#a485ff',right:'#68cbd7',appearance:'Dark',accent:'#a58cde',radius:18};
  const saved = window.openai?.widgetState?.modelContent?.layouts || {};
  const template = id => document.getElementById(id).content.cloneNode(true);
  function restore(name) {
    const data = saved[name] || {};
    const s = {...defaults,audio:name==='Compact controls'};
    for (const key of Object.keys(defaults)) {
      if (typeof data[key]===typeof defaults[key]) s[key]=data[key];
    }
    if (!effects.includes(s.effect)) s.effect='Ambient';
    if (!['Top','Bottom'].includes(s.source)) s.source='Top';
    if (!['Dark','Light'].includes(s.appearance)) s.appearance='Dark';
    for (const key of ['brightness','sensitivity','response','saturation','speed']) s[key]=Math.max(0,Math.min(100,s[key]));
    for (const key of ['left','right','accent']) if (!/^#[0-9a-f]{6}$/i.test(s[key])) s[key]=defaults[key];
    s.radius=Math.max(12,Math.min(30,s.radius));
    return s;
  }
  function persist() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{layouts:states}}).catch(()=>{});
  }
  function populateContext(app,s) {
    const compact=app.classList.contains('rl-compact');
    const slot=app.querySelector('[data-context-slot]');
    if (slot) {
      slot.replaceChildren(template(s.effect==='Ambient' ? (compact?'rl-context-compact':'rl-context-ambient'):'rl-context-color'));
      slot.querySelector('[data-speed-setting]')?.toggleAttribute('hidden',s.effect==='Solid');
    }
    const source=app.querySelector('[data-compact-source]');
    if (source) {
      if (s.effect==='Ambient') {
        source.innerHTML='<span class="rl-label">Capture screen</span><div class="rl-segments"><button type="button" class="cursor-interaction" data-source="Top">Top</button><button type="button" class="cursor-interaction" data-source="Bottom">Bottom</button></div>';
      } else {
        source.innerHTML='<span class="rl-label">Color</span><div class="rl-color-fields"><input type="color" data-field="left" aria-label="Left stick color"><input type="color" data-field="right" aria-label="Right stick color"></div>';
      }
    }
    const adjust=app.querySelector('[data-adjust-context]');
    if (adjust) { adjust.replaceChildren(template(s.effect==='Ambient'?'rl-context-ambient':'rl-context-color')); adjust.querySelector('[data-speed-setting]')?.toggleAttribute('hidden',s.effect==='Solid'); }
    app.querySelector('[data-adjust-saturation]')?.toggleAttribute('hidden',s.effect!=='Ambient');
  }
  function render(app,s) {
    app.dataset.appearance=s.appearance;
    app.style.setProperty('--rl-accent',s.accent);
    app.style.setProperty('--rl-radius',s.radius+'px');
    app.querySelectorAll('[data-look-name]').forEach(el=>el.textContent=s.effect);
    const sub=s.effect==='Ambient' ? 'Follows your '+s.source.toLowerCase()+' screen' : ({Solid:'Your colors, held steady',Rainbow:'A smooth spectrum of color',Breathing:'A soft, steady rhythm',Pulse:'A brighter beat of color'})[s.effect];
    app.querySelectorAll('[data-look-sub]').forEach(el=>el.textContent=sub);
    app.querySelectorAll('[data-status]').forEach(el=>el.textContent=s.on?'Running':'Stopped');
    app.querySelectorAll('[data-power-word]').forEach(el=>el.textContent=s.on?'On':'Off');
    app.querySelectorAll('[data-power-hint]').forEach(el=>el.textContent=s.on?'Tap to stop':'Tap to start');
    app.querySelectorAll('[data-action="power"]').forEach(el=>{el.dataset.on=String(s.on);el.setAttribute('aria-pressed',String(s.on));el.setAttribute('aria-label',s.on?'Stop lighting':'Start lighting');});
    app.querySelectorAll('[data-action="audio"]').forEach(el=>el.setAttribute('aria-checked',String(s.audio)));
    app.querySelectorAll('[data-audio-on]').forEach(el=>el.hidden=!s.audio);
    app.querySelectorAll('[data-audio-off]').forEach(el=>el.hidden=s.audio);
    app.querySelectorAll('[data-effect]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.effect===s.effect)));
    app.querySelectorAll('[data-source]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.source===s.source)));
    app.querySelectorAll('[data-field]').forEach(el=>{const v=s[el.dataset.field];if(v!==undefined && el.value!==String(v))el.value=String(v);});
    app.querySelectorAll('[data-value]').forEach(el=>el.textContent=s[el.dataset.value]);
    app.querySelectorAll('[data-ring]').forEach(el=>{let c=el.dataset.ring==='left'?s.left:s.right;if(s.effect==='Rainbow') c=el.dataset.ring==='left'?'#d88ae8':'#78cfae';el.style.setProperty('--rl-ring-color',s.on?c:'var(--rl-line)');el.style.opacity=s.on?String(.4+s.brightness*.006):'1';});
    app.querySelectorAll('[data-footer]').forEach(el=>el.textContent=s.on?'Lighting continues when you close the app':'Lighting is stopped');
  }
  root.querySelectorAll('.rl-app').forEach(app=>{
    const name=app.dataset.layout;
    const s=states[name]=restore(name);
    app.append(template('rl-settings'));
    if(app.classList.contains('rl-focus'))app.append(template('rl-adjust'));
    populateContext(app,s);render(app,s);
    app.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button)return;
      let changed=false;
      if(button.dataset.effect){s.effect=button.dataset.effect;populateContext(app,s);changed=true;}
      if(button.dataset.source){s.source=button.dataset.source;changed=true;}
      if(button.dataset.action==='power'){s.on=!s.on;changed=true;}
      if(button.dataset.action==='audio'){s.audio=!s.audio;changed=true;}
      if(['settings','adjust'].includes(button.dataset.action))app.querySelector('[data-overlay="'+button.dataset.action+'"]').hidden=false;
      if(button.dataset.action==='close')app.querySelectorAll('[data-overlay]').forEach(el=>el.hidden=true);
      if(changed){render(app,s);persist();}
    });
    app.addEventListener('input',event=>{
      const field=event.target.dataset.field;if(!field)return;
      s[field]=event.target.type==='range'?Number(event.target.value):event.target.value;
      if(field==='effect')populateContext(app,s);
      render(app,s);persist();
    });
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{render(app,s);persist();}});tweak.addColorPicker(s,'accent',{label:'Accent',reference:'--rl-accent'});tweak.addSlider(s,'radius',{label:'Card corners',min:12,max:30,step:2,unit:'px'});tweak.addSelect(s,'appearance',{label:'Appearance',options:['Dark','Light']});}
  });
  window.addEventListener('openai:set_globals',event=>{
    const layouts=event.detail?.globals?.widgetState?.modelContent?.layouts;
    if(!layouts)return;
    root.querySelectorAll('.rl-app').forEach(app=>{
      const data=layouts[app.dataset.layout];if(!data)return;
      const s=states[app.dataset.layout];
      for(const key of Object.keys(defaults))if(typeof data[key]===typeof defaults[key])s[key]=data[key];
      populateContext(app,s);render(app,s);
    });
  });
  if(globalThis.lucide)lucide.createIcons();
})();
</script>
